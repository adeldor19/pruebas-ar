<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Tech Lab · BUILD 001</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07111f;
      font-family: Arial, Helvetica, sans-serif;
    }

    #info {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      max-width: 340px;
      padding: 14px 16px;
      color: white;
      background: rgba(5, 12, 24, .82);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #info strong {
      display: block;
      margin-bottom: 7px;
      color: #58d6ff;
      font-size: 17px;
    }

    #info span {
      display: block;
      margin-top: 4px;
      color: #dce8f5;
      font-size: 13px;
      line-height: 1.4;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px;
      z-index: 5;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 50%;
      pointer-events: none;
    }

    #message {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 10;
      padding: 9px 14px;
      color: white;
      background: rgba(5, 12, 24, .72);
      border-radius: 999px;
      font-size: 12px;
      pointer-events: none;
    }

    canvas { display: block; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="info">
    <strong>VR TECH LAB · BUILD 001</strong>
    <span>Base Three.js + WebXR</span>
    <span>Colisiones: ACTIVADAS</span>
    <span>PC: WASD + ratón · VR: joystick izquierdo</span>
  </div>

  <div id="crosshair"></div>
  <div id="message">Haz clic en la escena para mirar con el ratón</div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    // ------------------------------------------------------------
    // 1. ESCENA
    // ------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07111f);
    scene.fog = new THREE.Fog(0x07111f, 10, 34);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.05,
      100
    );
    camera.position.set(0, 1.6, 0);

    // El dolly es el "cuerpo" del jugador.
    // La cámara va dentro de él, igual que en el referente.
    const dolly = new THREE.Group();
    dolly.add(camera);
    scene.add(dolly);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    document.body.appendChild(VRButton.createButton(renderer));

    // ------------------------------------------------------------
    // 2. ILUMINACIÓN
    // ------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0xbad8ff, 0x182234, 1.8));

    const mainLight = new THREE.DirectionalLight(0xffffff, 2.2);
    mainLight.position.set(4, 9, 3);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.set(1024, 1024);
    mainLight.shadow.camera.left = -12;
    mainLight.shadow.camera.right = 12;
    mainLight.shadow.camera.top = 12;
    mainLight.shadow.camera.bottom = -12;
    scene.add(mainLight);

    // ------------------------------------------------------------
    // 3. REJILLA LÓGICA
    //
    // # = bloqueado
    // . = libre
    //
    // La geometría y las colisiones salen de esta misma rejilla.
    // ------------------------------------------------------------

    const CELL_SIZE = 1.4;

    const grid = [
      "###############",
      "#.............#",
      "#..###........#",
      "#........###..#",
      "#..#..........#",
      "#..#..####....#",
      "#.....#.......#",
      "#.....#..###..#",
      "#.............#",
      "#.............#",
      "###############"
    ];

    const GH = grid.length;
    const GW = grid[0].length;
    const PLAYER_RADIUS = 0.30;

    function gridToWorld(gx, gy) {
      return {
        x: (gx - (GW - 1) / 2) * CELL_SIZE,
        z: (gy - (GH - 1) / 2) * CELL_SIZE
      };
    }

    function worldToGridApprox(x, z) {
      return {
        gx: Math.round(x / CELL_SIZE + (GW - 1) / 2),
        gy: Math.round(z / CELL_SIZE + (GH - 1) / 2)
      };
    }

    // ------------------------------------------------------------
    // 4. MUNDO VISUAL
    // ------------------------------------------------------------

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x24415f,
      roughness: 0.78,
      metalness: 0.08
    });

    const obstacleMaterial = new THREE.MeshStandardMaterial({
      color: 0xe36b32,
      roughness: 0.6,
      metalness: 0.12
    });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x101c2d,
      roughness: 0.92,
      metalness: 0.02
    });

    const wallGeometry = new THREE.BoxGeometry(
      CELL_SIZE,
      2.4,
      CELL_SIZE
    );

    const obstacleGeometry = new THREE.BoxGeometry(
      CELL_SIZE,
      1.8,
      CELL_SIZE
    );

    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(GW * CELL_SIZE, 0.15, GH * CELL_SIZE),
      floorMaterial
    );
    floor.position.y = -0.08;
    floor.receiveShadow = true;
    scene.add(floor);

    // Añadimos las paredes/obstáculos desde la misma grid.
    for (let gy = 0; gy < GH; gy++) {
      for (let gx = 0; gx < GW; gx++) {
        if (grid[gy][gx] !== '#') continue;

        const p = gridToWorld(gx, gy);

        const isOuterWall =
          gx === 0 || gy === 0 || gx === GW - 1 || gy === GH - 1;

        const mesh = new THREE.Mesh(
          isOuterWall ? wallGeometry : obstacleGeometry,
          isOuterWall ? wallMaterial : obstacleMaterial
        );

        mesh.position.set(p.x, isOuterWall ? 1.2 : 0.9, p.z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      }
    }

    // Líneas de referencia del suelo.
    const gridHelper = new THREE.GridHelper(
      GW * CELL_SIZE,
      GW,
      0x31506e,
      0x1b2c40
    );
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // ------------------------------------------------------------
    // 5. COLISIONES
    //
    // Esta es la parte importante de BUILD 001.
    // El jugador no atraviesa ninguna celda '#'.
    // X y Z se comprueban por separado para permitir deslizarse
    // junto a una pared.
    // ------------------------------------------------------------

    function isFree(x, z, radius) {
      const { gx, gy } = worldToGridApprox(x, z);

      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const cx = gx + ox;
          const cy = gy + oy;

          if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) continue;
          if (grid[cy][cx] !== '#') continue;

          const w = gridToWorld(cx, cy);
          const half = CELL_SIZE / 2;

          const closestX = Math.max(
            w.x - half,
            Math.min(x, w.x + half)
          );

          const closestZ = Math.max(
            w.z - half,
            Math.min(z, w.z + half)
          );

          const dx = x - closestX;
          const dz = z - closestZ;

          if (dx * dx + dz * dz < radius * radius) {
            return false;
          }
        }
      }

      return true;
    }

    function tryMove(pos, dx, dz, radius) {
      if (isFree(pos.x + dx, pos.z, radius)) {
        pos.x += dx;
      }

      if (isFree(pos.x, pos.z + dz, radius)) {
        pos.z += dz;
      }
    }

    // Posición inicial en una celda libre.
    const start = gridToWorld(1, 1);
    dolly.position.set(start.x, 0, start.z);

    // ------------------------------------------------------------
    // 6. MOVIMIENTO DE PC
    // ------------------------------------------------------------

    const keys = new Set();
    let pointerLocked = false;
    let yaw = 0;
    let pitch = 0;

    window.addEventListener('keydown', (event) => {
      keys.add(event.code);
    });

    window.addEventListener('keyup', (event) => {
      keys.delete(event.code);
    });

    renderer.domElement.addEventListener('click', () => {
      if (!renderer.xr.isPresenting) {
        renderer.domElement.requestPointerLock();
      }
    });

    document.addEventListener('pointerlockchange', () => {
      pointerLocked = document.pointerLockElement === renderer.domElement;

      document.getElementById('message').textContent =
        pointerLocked
          ? 'WASD para moverte · ratón para mirar · ESC para liberar el ratón'
          : 'Haz clic en la escena para mirar con el ratón';
    });

    document.addEventListener('mousemove', (event) => {
      if (!pointerLocked || renderer.xr.isPresenting) return;

      yaw -= event.movementX * 0.0022;
      pitch -= event.movementY * 0.0022;

      const limit = Math.PI / 2 - 0.05;
      pitch = Math.max(-limit, Math.min(limit, pitch));

      dolly.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    function updateDesktopMovement() {
      if (renderer.xr.isPresenting) return;

      let forward = 0;
      let strafe = 0;

      if (keys.has('KeyW') || keys.has('ArrowUp')) forward += 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) forward -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) strafe += 1;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) strafe -= 1;

      if (forward === 0 && strafe === 0) return;

      const length = Math.hypot(forward, strafe);
      forward /= length;
      strafe /= length;

      const speed = 0.075;

      const forwardVector = new THREE.Vector3(
        -Math.sin(dolly.rotation.y),
        0,
        -Math.cos(dolly.rotation.y)
      );

      const rightVector = new THREE.Vector3(
        Math.cos(dolly.rotation.y),
        0,
        -Math.sin(dolly.rotation.y)
      );

      const dx =
        (forwardVector.x * forward + rightVector.x * strafe) * speed;

      const dz =
        (forwardVector.z * forward + rightVector.z * strafe) * speed;

      tryMove(dolly.position, dx, dz, PLAYER_RADIUS);
    }

    // ------------------------------------------------------------
    // 7. CONTROLES VR
    //
    // El joystick izquierdo mueve el dolly.
    // El derecho gira al jugador.
    // ------------------------------------------------------------

    const controllers = [renderer.xr.getController(0), renderer.xr.getController(1)];
    const controllerStates = [
      { inputSource: null },
      { inputSource: null }
    ];

    controllers.forEach((controller, index) => {
      controller.addEventListener('connected', (event) => {
        controllerStates[index].inputSource = event.data;
      });

      controller.addEventListener('disconnected', () => {
        controllerStates[index].inputSource = null;
      });

      scene.add(controller);
    });

    const controllerModelFactory = new XRControllerModelFactory();

    const controllerGrips = [
      renderer.xr.getControllerGrip(0),
      renderer.xr.getControllerGrip(1)
    ];

    controllerGrips.forEach((grip) => {
      grip.add(
        controllerModelFactory.createControllerModel(grip)
      );
      scene.add(grip);
    });

    function updateVRMovement() {
      if (!renderer.xr.isPresenting) return;

      const left = controllerStates[0].inputSource;
      const right = controllerStates[1].inputSource;

      // Algunos visores pueden devolver los mandos en distinto orden.
      const leftGamepad = left && left.handedness === 'left'
        ? left.gamepad
        : null;

      const rightGamepad = right && right.handedness === 'right'
        ? right.gamepad
        : null;

      if (leftGamepad && leftGamepad.axes.length >= 4) {
        const x = leftGamepad.axes[2] ?? leftGamepad.axes[0] ?? 0;
        const y = leftGamepad.axes[3] ?? leftGamepad.axes[1] ?? 0;

        const deadZone = 0.15;

        const moveX = Math.abs(x) > deadZone ? x : 0;
        const moveY = Math.abs(y) > deadZone ? y : 0;

        if (moveX !== 0 || moveY !== 0) {
          const speed = 0.045;

          const forward = new THREE.Vector3(
            -Math.sin(dolly.rotation.y),
            0,
            -Math.cos(dolly.rotation.y)
          );

          const rightVector = new THREE.Vector3(
            Math.cos(dolly.rotation.y),
            0,
            -Math.sin(dolly.rotation.y)
          );

          tryMove(
            dolly.position,
            (rightVector.x * moveX + forward.x * -moveY) * speed,
            (rightVector.z * moveX + forward.z * -moveY) * speed,
            PLAYER_RADIUS
          );
        }
      }

      if (rightGamepad && rightGamepad.axes.length >= 4) {
        const x = rightGamepad.axes[2] ?? rightGamepad.axes[0] ?? 0;

        if (Math.abs(x) > 0.2) {
          dolly.rotation.y -= x * 0.035;
        }
      }
    }

    // ------------------------------------------------------------
    // 8. RESIZE
    // ------------------------------------------------------------

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ------------------------------------------------------------
    // 9. BUCLE PRINCIPAL
    // ------------------------------------------------------------

    function render() {
      updateDesktopMovement();
      updateVRMovement();

      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(render);
  </script>
</body>
</html>
